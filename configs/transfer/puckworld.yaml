# PPO on pixel PuckWorld with continuous 2-D control and dense potential-based reward.
env: puckworld
timesteps: 300000
n_envs: 8
frame_stack: 4
learning_rate: 0.0003
lr_schedule: linear
n_steps: 128
batch_size: 256
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
features_dim: 512
net_arch: [256]
eval_freq: 20000
eval_episodes: 10
