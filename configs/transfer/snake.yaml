# PPO on pixel Snake (10x10 grid rendered to 84x84).
env: snake
timesteps: 500000
n_envs: 8
frame_stack: 4
learning_rate: 0.00025
lr_schedule: linear
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.01
features_dim: 512
net_arch: [256]
eval_freq: 25000
eval_episodes: 10
