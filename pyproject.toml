[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrl"
version = "0.2.0"
description = "CTRL: Cross-Task Reinforcement Learning — transfer, meta- and continual learning experiments."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ak811" }]
requires-python = ">=3.10"
keywords = ["reinforcement-learning", "transfer-learning", "meta-learning", "continual-learning", "maml", "reptile", "ewc", "ppo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
atari = ["ale-py>=0.10"]
tensorboard = ["tensorboard>=2.14"]
video = ["moviepy>=1.0.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6", "pre-commit>=3.5"]
all = ["ctrl[atari,tensorboard,video,dev]"]

[project.urls]
Repository = "https://github.com/ak811/ctrl"

[project.scripts]
ctrl-transfer = "transfer.train:main"
ctrl-transfer-eval = "transfer.evaluate:main"
ctrl-transfer-analyze = "transfer.analyze:main"
ctrl-meta = "meta.train:main"
ctrl-meta-eval = "meta.evaluate:main"
ctrl-continual = "continual.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "envs*", "transfer*", "meta*", "continual*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*You are trying to run PPO on the GPU.*:UserWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["common", "envs", "transfer", "meta", "continual"]

[tool.coverage.run]
source = ["common", "envs", "transfer", "meta", "continual"]
